name: Release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release

  publish:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: "Smoke test (amd64): образ собирается и стартует"
        run: |
          docker build -t smoke .
          docker run -d --name smoke -p 8080:8080 \
            -e Updater__Deploy__AllowedImagePrefixes__0=ghcr.io/example/ \
            -e Updater__Targets__0__Name=t -e Updater__Targets__0__File=/tmp/compose.yml smoke
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/health && exit 0; sleep 1; done
          docker logs smoke
          exit 1

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.CONTAINER_REGISTRY }}/${{ vars.CONTAINER_NAMESPACE }}/${{ vars.CONTAINER_IMAGE }}
          tags: |
            type=sha,format=short,priority=1000
            type=raw,value=latest,priority=100
          labels: |
            org.opencontainers.image.title=VDS Service Updater
            org.opencontainers.image.description=Webhook service for deploying container images from CI/CD to Docker Compose and Docker Swarm targets.
            org.opencontainers.image.authors=${{ github.repository_owner }} (GitHub)
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            com.github.issues=${{ github.server_url }}/${{ github.repository }}/issues

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=0.0.0-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
