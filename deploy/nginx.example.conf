# nginx перед апдейтером. Деплой синхронный и может идти минуту и дольше, поэтому таймауты прокси
# ОБЯЗАТЕЛЬНО больше Updater:Deploy:WaitTimeoutSeconds (с запасом на откат: до 2x).

limit_req_zone $binary_remote_addr zone=updater:1m rate=30r/m;

server {
    listen 443 ssl;
    server_name deploy.example.com;

    ssl_certificate     /etc/letsencrypt/live/deploy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deploy.example.com/privkey.pem;

    client_max_body_size 8k;

    location /api/ {
        limit_req zone=updater burst=10 nodelay;

        # Опционально: пускать только из подсетей CI (или закрыть доступ VPN/файрволом)
        # allow 203.0.113.0/24;
        # deny  all;

        proxy_pass http://127.0.0.1:8080;           # swarm: http://vds-service-updater:8080
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;                 # главное: по умолчанию 60s оборвёт долгий деплой
        proxy_buffering       off;
        proxy_ignore_client_abort on;               # обрыв клиента не рвёт соединение с апдейтером
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }
}
